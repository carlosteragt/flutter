name: emprestimo_app
description: Um aplicativo para calcular empréstimos com integração ao Supabase

publish_to: 'none' # Isso evita o envio para o pub.dev

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^0.2.8 # Dependência do Supabase
  flutter_dotenv: ^5.0.2 # Para carregar variáveis de ambiente
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/background.png
    - assets/icon/icon.png
